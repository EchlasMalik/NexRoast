name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs the postinstall hook, which generates the Prisma client.
      # The generated client is gitignored, so nothing typechecks without it.
      # Generation reads the schema only — no database connection needed.
      - run: npm ci

      - run: npx prettier --check .

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test
